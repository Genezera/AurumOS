# Configuração de capital e risco do AurumOS.
# Uma conta, uma corretora (Bybit), base US$200. Estes números são um ponto
# de partida para shadow/Bybit Demo e precisam de validação fora da amostra.

total_equity_start = 200.0

# Fração do lucro de cada ciclo positivo que vai para reserva protegida
# em vez de ser reinvestida no capital operacional. Vale para as
# estratégia executora de microestrutura — ver Strategy::is_rare_event.
protected_reserve_pct = 0.20
reinvest_pct = 0.80

# Divisão de 3 vias específica para lucro de estratégias de "evento raro"
# (Launch Radar, Whale Watch, News, Macro, Pump Exhaustion, Liquidation
# Hunter): 70% reinvestido (implícito, o que sobra), 20% reserva protegida,
# 10% pra uma reserva de infraestrutura/custos — essas estratégias são
# esporádicas por natureza, então uma fatia menor fica disponível pra
# reinvestir imediatamente.
rare_event_reserve_pct = 0.20
rare_event_infra_pct = 0.10

# Tamanho inicial de uma "perna" de operação (ordem por estratégia).
initial_leg_size = 25.0

# Risco total simultâneo somando todas as estratégias.
total_risk_pct = 0.0050

# Kill-switch automático em camadas (Fase 12) — revisado após auditoria
# técnica externa (13/08/2026): 5% diário era alto demais para microcapital.
# A proteção não-destrutiva contra drawdown hoje é o teto aplicado ao
# tamanho EFETIVO da ordem (ver drawdown_ceiling_multiplier em risk.rs,
# tiers fixos no código) — não o drawdown_halve_threshold_pct abaixo, que
# não aciona mais nenhuma redução de perna (ver comentário dele).
#
# Preventivo: emite aviso no dashboard; não bloqueia novas execuções.
daily_warn_pct = 0.01
# Bloqueio rígido diário: para novas execuções até o dia seguinte (UTC) ou
# até ser destravado manualmente (ver data/KILL). Reduzido de 2% para 1,5%
# (2ª revisão técnica externa, 13/08/2026) — pra US$200 e o objetivo de
# preservar capacidade de composição, 2% era generoso demais.
daily_halt_pct = 0.015
# Bloqueio semanal: mesmo mecanismo, janela de 7 dias corridos — pega
# drawdown que se acumula devagar ao longo de vários dias sem nenhum deles
# isoladamente bater o limite diário.
weekly_halt_pct = 0.04
# Bloqueio por drawdown total (desde o pico histórico de todos os tempos,
# não só do dia/semana atual) — rede de segurança final. Diferente dos
# outros 3 níveis, este NÃO se libera sozinho quando o equity recupera —
# exige confirmação manual explícita (ver risk.rs::kill_switch_reason e
# data/RESET_DRAWDOWN_HALT), por ser o nível mais grave.
total_drawdown_halt_pct = 0.07

# Risco máximo (capital em risco / equity total) que cada estratégia pode
# ter aberto simultaneamente.
[strategy_risk_pct]
order_flow = 0.0025

[leverage]
# Nenhuma alavancagem em lançamentos de tokens (livro/liquidez não
# confiáveis). Histórico: chegou a ter uma trava própria e independente
# (`RejectReason::NoLeverageOnLaunch`); Launch é ObservationOnly hoje e cai
# no `ExecutionDisabled` genérico antes de chegar em qualquer checagem de
# alavancagem, então esta chave só alimenta um valor de exibição no
# dashboard (events.rs) — se Launch ganhar executor próprio no futuro, essa
# trava independente deveria voltar em vez de confiar só no liquid_max abaixo.
launch_max = 1.0
# Alavancagem máxima em instrumentos líquidos. O executor atual usa 1x.
liquid_max = 2.0
# Teto global de alavancagem do PORTFÓLIO INTEIRO (task #89, auditoria
# externa 13/08/2026) — soma do notional alavancado de TODAS as posições
# abertas ao mesmo tempo, dividido pelo equity. Diferente de launch_max/
# liquid_max acima, que só olham uma oportunidade isolada: várias posições
# 2x em estratégias diferentes passariam nelas individualmente mas juntas
# poderiam expor o portfólio bem além de 1x. Default conservador (1.0 =
# sem alavancagem agregada); nunca pode passar de 2.0 mesmo que este valor
# seja aumentado (ver ABSOLUTE_LEVERAGE_CEILING em risk.rs).
global_max = 1.0

[scaling]
# Ciclos mínimos desde o último aumento de perna antes de permitir outro.
min_cycles_between_scale = 50
# Drawdown máximo (fração do pico de equity) permitido para autorizar escalonamento.
max_drawdown_pct_for_scale = 0.02
# Histórico: chegou a acionar redução de perna pela metade a cada trade em
# drawdown, mas isso colapsava a perna até o piso e nunca recuperava
# sozinho (auditoria externa, 12/08/2026 — ver comentário em risk.rs::
# maybe_scale). Removido; hoje esta chave só alimenta um valor de exibição
# no dashboard (events.rs) e não aciona nenhuma redução de perna — a
# proteção de verdade é o teto não-destrutivo em drawdown_ceiling_multiplier.
drawdown_halve_threshold_pct = 0.02
# Fator de crescimento aplicado à perna quando as condições de escalonamento são atendidas.
scale_growth_factor = 1.15
# Fator de REDUÇÃO aplicado à perna quando o profit factor recente cai
# abaixo de min_recent_profit_factor_to_hold (task #87, auditoria externa
# 13/08/2026: "hierarquia PF 1,3 aprovação vs 1,2 continuar + redução
# ativa se piorar"). Mais agressivo que o inverso do crescimento (1/1.15 =
# 0.87) de propósito — reagir a uma piora deve ser mais rápido que crescer
# numa melhora, princípio comum de gestão de risco.
scale_shrink_factor = 0.80
# Fração máxima do equity total que uma única perna pode representar.
max_leg_fraction_of_equity = 0.30
# Hierarquia de 2 níveis de profit factor (janela móvel dos últimos
# trades), task #87 (auditoria externa, 13/08/2026) — substitui o limiar
# único anterior (1.2, ele mesmo já elevado de 1.1 numa revisão técnica
# anterior por ser frágil demais contra ruído/custos). Acima do nível de
# APROVAÇÃO autoriza crescer a perna; abaixo do nível de CONTINUAR (ver
# min_recent_profit_factor_to_hold) força uma redução ativa; entre os
# dois, mantém o tamanho atual — zona de tolerância a ruído, evita
# oscilar a cada trade. Combinado com a checagem de "resultado ainda
# positivo removendo o melhor trade" (risk.rs::positive_excluding_best_trade)
# pra crescer, não só o profit factor bruto.
min_recent_profit_factor_for_scale = 1.3
# Nível de "continuar" da hierarquia acima — abaixo disto, a estratégia
# não está só "não boa o suficiente pra crescer", está degradando o
# suficiente pra reduzir ativamente.
min_recent_profit_factor_to_hold = 1.2
# Amostra mínima na janela móvel antes do profit factor contar pra algo —
# menor que min_cycles_between_scale de propósito, pra não virar um segundo
# gargalo redundante.
min_recent_samples_for_scale = 30
# Recuperação parcial (12/08/2026): fração do maior drawdown LOCAL da
# própria estratégia (pico→vale de PnL acumulado) que precisa estar
# recuperada antes de liberar escalonamento — substitui a exigência antiga
# de equity do PORTFÓLIO INTEIRO bater novo pico, que travava uma
# estratégia individualmente lucrativa só porque outra ainda não recuperou.
partial_recovery_fraction = 0.80
# Fração do Kelly cheio realmente aplicada ao tamanho da perna (Kelly
# fracionário, 12/08/2026) — Kelly cheio maximiza crescimento assumindo
# taxa de acerto/payoff exatos e conhecidos, o que nunca é o caso com
# amostra finita; uma fração conservadora mantém a maior parte do
# crescimento perdendo bem menos robustez.
kelly_safety_fraction = 0.30
